version: '3.8'

# =============================================================================
# Zero-Knowledge File Encryption System
# Docker Compose - Development & Production
#
# Usage:
#   1. cp .env.example .env  (then edit .env with your values)
#   2. docker compose up -d
#   3. Open http://localhost:3000
#
# Service URLs:
#   Frontend:       http://localhost:3000
#   Backend API:    http://localhost:8000
#   API Docs:       http://localhost:8000/docs
#   MinIO Console:  http://localhost:9001
# =============================================================================

services:
  # ─── Frontend (React + Vite + Nginx) ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_HCAPTCHA_SITE_KEY=${HCAPTCHA_SITE_KEY:-}
      - VITE_APP_NAME=Zero Knowledge Encryption
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # ─── Backend (FastAPI + Python) ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Database
      - DATABASE_URL=mongodb://mongodb:27017
      - DATABASE_NAME=${DATABASE_NAME:-zero_knowledge_encryption}
      # MinIO
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-encrypted-files}
      - MINIO_USE_SSL=false
      # CORS - allow frontend
      - ALLOWED_ORIGINS=["http://localhost:3000","http://localhost:5173"]
      # App
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=false
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ─── MongoDB ──────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-changeme}
      - MONGO_INITDB_DATABASE=${DATABASE_NAME:-zero_knowledge_encryption}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # ─── MinIO (S3-compatible Object Storage) ────────────────────────────────────
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console UI
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

# =============================================================================
# Volumes
# =============================================================================
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  minio_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  app-network:
    driver: bridge
